name: Validate docs (PR)

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

env:
  MARK_IMAGE: kovetskiy/mark:v16.25.0

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PR validation never receives Confluence credentials and never
      # publishes: --compile-only renders every page (Mermaid included) and
      # fails on internal links that do not resolve to a document with a title.
      - name: Compile docs and check internal links (mark)
        env:
          MARK_FILES: docs/**/*.md
          # The space key is already public in this repository's docs.
          MARK_SPACE: GHConfDocs
          MARK_PARENTS_FROM_PATH: "true"
          MARK_FEATURES: mermaid,frontmatter
          MARK_CHECK_LINKS: internal
          MARK_COMPILE_ONLY: "true"
          MARK_OUTPUT_FORMAT: github
        run: |
          docker run --rm \
            -v "$PWD:/docs" \
            -e MARK_FILES -e MARK_SPACE -e MARK_PARENTS_FROM_PATH \
            -e MARK_FEATURES -e MARK_CHECK_LINKS -e MARK_COMPILE_ONLY \
            -e MARK_OUTPUT_FORMAT \
            "$MARK_IMAGE" mark publish
