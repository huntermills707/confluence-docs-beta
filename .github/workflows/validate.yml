name: Validate docs (PR)

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out pinned confluence-docs-sync release
        uses: actions/checkout@v4
        with:
          repository: huntermills707/confluence-docs-sync
          ref: 6d5e2d38a5388f07b7725ccb0e40e3aee0703690
          path: .confluence-docs-sync
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .confluence-docs-sync/requirements.txt

      - name: Install tool dependencies
        run: pip install -r .confluence-docs-sync/requirements.txt

      # PR validation never receives Confluence credentials or publishes.
      - name: Validate front matter, links, images and Mermaid
        run: python .confluence-docs-sync/scripts/validate.py --repo-root "${{ github.workspace }}"
